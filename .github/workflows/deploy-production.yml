name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy main to production
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production over SSH
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.PROD_HOST }} '
            set -e
            cd ~/online-judge
            git fetch origin
            git checkout main
            git pull origin main
            docker compose up -d --build
            cd judge-worker
            npm ci
            pm2 restart judge-worker
            cd ../frontend
            npm ci
            npm run build
          '
