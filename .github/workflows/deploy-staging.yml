name: Deploy to Staging

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  deploy-staging:
    name: Deploy PR to staging
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging over SSH
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.STAGING_HOST }} "
            set -e
            cd ~/online-judge
            git fetch origin
            git checkout '$PR_BRANCH'
            git pull origin '$PR_BRANCH'
            docker compose up -d --build
            cd judge-worker
            npm ci
            pm2 restart judge-worker
            cd ../frontend
            npm ci
            npm run build
          "

      - name: Comment staging URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Deployed to staging: https://18-61-196-162.sslip.io'
            })
